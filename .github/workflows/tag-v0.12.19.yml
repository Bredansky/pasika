name: Tag and dispatch Pasika v0.12.19

on:
  push:
    branches:
      - main
    paths:
      - package.json

permissions:
  contents: write
  actions: write

jobs:
  tag-and-dispatch:
    if: github.repository == 'Bredansky/pasika'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create tag and run established publish workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(node -p 'require("./package.json").version')" = "0.12.19"
          test "$(node -p 'require("./package-lock.json").version')" = "0.12.19"
          test "$(node -p 'require("./package-lock.json").packages[""].version')" = "0.12.19"
          if git ls-remote --exit-code --tags origin refs/tags/v0.12.19 >/dev/null 2>&1; then
            echo "v0.12.19 already exists; skipping"
            exit 0
          fi
          git tag v0.12.19
          git push origin v0.12.19
          # Events pushed with GITHUB_TOKEN do not start tag workflows; dispatch explicitly.
          gh workflow run publish.yml --ref v0.12.19
