name: Verify Pasika v0.12.17 tarball integrity

on:
  push:
    branches:
      - "automation/publish-v0.12.17-20261123"

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact published tag
        uses: actions/checkout@v6
        with:
          ref: v0.12.17

      - name: Set up publishing Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reproduce tarball and compare against published shasum
        run: |
          set -euo pipefail
          npm pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/pasika-pack.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const pack = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/pasika-pack.json", "utf8"))[0];
            console.log("SHASUM=" + pack.shasum);
            console.log("INTEGRITY=" + pack.integrity);
            if (pack.shasum !== "17a5aac4b6eb925f1dc23106d5c52cb12b320be3") {
              throw new Error("Tarball shasum differs from npm publish log; do not reuse integrity");
            }
          '
