name: Dispatch Pasika v0.12.17 release

on:
  push:
    branches:
      - "automation/publish-v0.12.17-20261123"

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Tag the verified main commit and dispatch the existing publisher
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
          version="$(gh api "repos/$REPO/contents/package.json?ref=main" --jq '.content' | base64 -d | jq -r '.version')"
          test "$version" = "0.12.17" || { echo "Unexpected version on main: $version"; exit 1; }
          if gh api "repos/$REPO/git/ref/tags/v0.12.17" >/dev/null 2>&1; then
            existing_sha="$(gh api "repos/$REPO/git/ref/tags/v0.12.17" --jq '.object.sha')"
            test "$existing_sha" = "$main_sha" || { echo "Existing tag points to a different commit"; exit 1; }
          else
            gh api --method POST "repos/$REPO/git/refs" -f ref="refs/tags/v0.12.17" -f sha="$main_sha"
          fi
          gh workflow run publish.yml --repo "$REPO" --ref "v0.12.17"
          echo "Dispatched official Pasika publish.yml for v0.12.17"
