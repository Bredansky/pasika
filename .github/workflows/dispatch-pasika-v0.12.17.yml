name: Verify Pasika v0.12.17 tarball integrity

on:
  push:
    branches:
      - "automation/publish-v0.12.17-20261123"

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact published tag
        uses: actions/checkout@v6
        with:
          ref: v0.12.17

      - name: Set up publishing Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reproduce tarball and compare against published shasum
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP" >/dev/null
          tarball="$RUNNER_TEMP/pasika-0.12.17.tgz"
          shasum="$(sha1sum "$tarball" | cut -d ' ' -f 1)"
          echo "SHASUM=$shasum"
          test "$shasum" = "17a5aac4b6eb925f1dc23106d5c52cb12b320be3" || { echo "Repacked tarball differs from published npm tarball"; exit 1; }
          integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
          echo "INTEGRITY=$integrity"
