name: Checks

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Repeated commits to one PR/branch supersede earlier CI runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Generate provisional lockfile for dependency review
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { execFileSync } from "node:child_process";
            const base = JSON.parse(execFileSync("git", ["show", "HEAD:package-lock.json"], { encoding: "utf8" }));
            const now = JSON.parse(readFileSync("package-lock.json", "utf8"));
            const changed = Object.fromEntries(Object.entries(now.packages).filter(([name, value]) => JSON.stringify(base.packages[name]) !== JSON.stringify(value)));
            const removed = Object.keys(base.packages).filter((name) => !(name in now.packages));
            console.log("PASIKA_LOCK_DELTA_START" + JSON.stringify({ changed, removed }) + "PASIKA_LOCK_DELTA_END");
          '

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Verify unit coverage
        run: npm run test:unit:coverage:check

      - name: Verify requirements
        run: npm run test:requirements

      - name: Build
        run: npm run build

      - name: Smoke-test packed package in isolated consumer
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" >/dev/null
          mkdir -p "$RUNNER_TEMP/pasika-consumer"
          cd "$RUNNER_TEMP/pasika-consumer"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/pasika-*.tgz
          node --input-type=module -e 'const p = await import("pasika/eslint"); if (Object.keys(p).length === 0) throw new Error("Empty Pasika ESLint export");'
