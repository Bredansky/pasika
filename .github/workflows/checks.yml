name: Checks

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Repeated commits to one PR/branch supersede earlier CI runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Verify unit coverage
        run: npm run test:unit:coverage:check

      - name: Verify requirements
        run: npm run test:requirements

      - name: Build
        run: npm run build

      - name: Smoke-test packed runtime helpers without lint dependencies
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" >/dev/null
          mkdir -p "$RUNNER_TEMP/pasika-runtime-consumer"
          cd "$RUNNER_TEMP/pasika-runtime-consumer"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/pasika-*.tgz
          node --input-type=module -e 'const p = await import("pasika/http-method"); if (Object.keys(p).length === 0) throw new Error("Empty Pasika runtime helper export");'
          test ! -d node_modules/@typescript-eslint
          test ! -d node_modules/@tailwindcss/node

      - name: Smoke-test packed ESLint preset with explicit optional peers
        run: |
          mkdir -p "$RUNNER_TEMP/pasika-eslint-consumer"
          cd "$RUNNER_TEMP/pasika-eslint-consumer"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --save-dev "$RUNNER_TEMP"/pasika-*.tgz eslint@10.9.1 typescript@6.0.3 @typescript-eslint/parser@8.73.0 @tailwindcss/node@4.3.5 @eslint/css-tree@4.0.5 @eslint/css@1.4.0 @eslint/json@2.0.1 @eslint/markdown@8.0.3 yaml@2.9.0
          node --input-type=module -e 'const p = await import("pasika/eslint"); if (Object.keys(p).length === 0) throw new Error("Empty Pasika ESLint export");'
